name: Glide Server Session

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: Minecraft server version
        required: true
        default: 1.20.4
        type: string
      xmx_gb:
        description: JVM heap size in GB
        required: true
        default: 4
        type: number
      online_mode:
        description: Whether the server should require online auth
        required: true
        default: true
        type: boolean
      server_name:
        description: Optional override for the server name in Server/Style/server.json
        required: false
        default: ""
        type: string
      server_description:
        description: Optional override for the server description in Server/Style/server.json
        required: false
        default: ""
        type: string
      max_runtime_minutes:
        description: Maximum runtime before a server handoff; GitHub caps jobs at 360 minutes
        required: true
        default: 330
        type: number
      server_slot:
        description: Active server slot; A and B alternate during handoff
        required: true
        default: A
        type: choice
        options:
          - A
          - B

permissions:
  contents: write
  actions: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read server style config
        shell: bash
        run: |
          set -euo pipefail
          SERVER_STYLE_FILE="$GITHUB_WORKSPACE/Server/Style/server.json"
          if [ -f "$SERVER_STYLE_FILE" ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print("GLIDE_SERVER_NAME="+d.get("name","Glide Server")); print("GLIDE_SERVER_DESCRIPTION="+d.get("description","A lightweight Minecraft server profile for your Glide setup.")); print("GLIDE_SERVER_MOTD="+d.get("motd",d.get("name","Glide Server")))' "$SERVER_STYLE_FILE" >> "$GITHUB_ENV"
          else
            echo "GLIDE_SERVER_NAME=Glide Server" >> "$GITHUB_ENV"
            echo "GLIDE_SERVER_DESCRIPTION=A lightweight Minecraft server profile for your Glide setup." >> "$GITHUB_ENV"
            echo "GLIDE_SERVER_MOTD=Glide Server" >> "$GITHUB_ENV"
          fi

      - name: Prepare server files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/server"
          SERVER_NAME="${{ inputs.server_name }}"
          SERVER_DESC="${{ inputs.server_description }}"
          if [ -z "$SERVER_NAME" ]; then
            SERVER_NAME="${GLIDE_SERVER_NAME:-Glide Server}"
          fi
          if [ -z "$SERVER_DESC" ]; then
            SERVER_DESC="${GLIDE_SERVER_DESCRIPTION:-A lightweight Minecraft server profile for your Glide setup.}"
          fi
          echo "SERVER_NAME=$SERVER_NAME" >> "$GITHUB_ENV"
          echo "SERVER_DESC=$SERVER_DESC" >> "$GITHUB_ENV"
          echo "GLIDE_SERVER_NAME=$SERVER_NAME" >> "$GITHUB_ENV"
          echo "GLIDE_SERVER_DESCRIPTION=$SERVER_DESC" >> "$GITHUB_ENV"

          if [ -d "$GITHUB_WORKSPACE/Server/Icon" ]; then
            cp -a "$GITHUB_WORKSPACE/Server/Icon/." "$GITHUB_WORKSPACE/server/"
          fi
          if [ -d "$GITHUB_WORKSPACE/Server/Plugins" ]; then
            mkdir -p "$GITHUB_WORKSPACE/server/plugins"
            cp -a "$GITHUB_WORKSPACE/Server/Plugins/." "$GITHUB_WORKSPACE/server/plugins/"
          fi

          cat > "$GITHUB_WORKSPACE/server/server.properties" <<EOF
          level-name=world
          gamemode=survival
          difficulty=normal
          allow-nether=true
          online-mode=${{ inputs.online_mode }}
          motd=${SERVER_DESC}
          server-name=${SERVER_NAME}
          server-port=25565
          server-ip=127.0.0.1
          spawn-protection=16
          max-players=20
          EOF

          echo "eula=true" > "$GITHUB_WORKSPACE/server/eula.txt"
          echo "Accepted Minecraft EULA automatically for this server session."

      - name: Detect and install required Java
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.minecraft_version }}"
          MANIFEST_URL="https://launchermeta.mojang.com/mc/game/version_manifest_v2.json"
          VERSION_URL="$(curl -fsSL "$MANIFEST_URL" | python3 -c 'import json,sys; v=sys.argv[1]; d=json.load(sys.stdin); m=next(x for x in d["versions"] if x["id"]==v); print(m["url"])' "$VERSION")"
          JAVA_MAJOR="$(curl -fsSL "$VERSION_URL" | python3 -c 'import json,sys,re; d=json.load(sys.stdin); a=d.get("javaVersion",{}).get("majorVersion"); print(a or "")')"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Minecraft $VERSION did not publish a required Java version; defaulting to Java 21."
            JAVA_MAJOR=21
          fi
          echo "Minecraft $VERSION requires Java $JAVA_MAJOR"
          echo "JAVA_MAJOR=$JAVA_MAJOR" >> "$GITHUB_ENV"

      - name: Install required Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ env.JAVA_MAJOR }}'

      - name: Download server jar
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.minecraft_version }}"
          JAR_DIR="$GITHUB_WORKSPACE/server"
          mkdir -p "$JAR_DIR"
          MANIFEST_URL="https://launchermeta.mojang.com/mc/game/version_manifest_v2.json"
          JAR_URL="$(curl -fsSL "$MANIFEST_URL" | python3 -c 'import json,sys; data=json.load(sys.stdin); versions=data["versions"]; version=sys.argv[1]; match=next((v for v in versions if v["id"]==version), None); assert match, f"Version not found: {version}"; print(match["url"])' "$VERSION")"
          curl -fsSL "$JAR_URL" -o "$JAR_DIR/version.json"
          SERVER_URL=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d["downloads"]["server"]["url"])' "$JAR_DIR/version.json")
          curl -fsSL "$SERVER_URL" -o "$JAR_DIR/server.jar"
          echo "GLIDE_SERVER_JAR=$JAR_DIR/server.jar"

      - name: Start server
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          WORLD_ROOT="$GITHUB_WORKSPACE/Server/World"
          mkdir -p "$WORLD_ROOT"

          LATEST_SAVE="$(find "$WORLD_ROOT" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1 || true)"
          if [ -n "$LATEST_SAVE" ] && [ -d "$LATEST_SAVE/world" ]; then
            echo "GLIDE_WORLD_MODE=restore"
            rm -rf "$GITHUB_WORKSPACE/server/world"
            cp -a "$LATEST_SAVE/world" "$GITHUB_WORKSPACE/server/world"
            echo "GLIDE_WORLD_RESTORED=$LATEST_SAVE"
          else
            echo "No saved world found; Minecraft will generate a new world."
            rm -rf "$GITHUB_WORKSPACE/server/world"
            echo "GLIDE_WORLD_MODE=new"
            echo "GLIDE_WORLD_RESTORED=none"
          fi

          save_world() {
            local stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            local save_dir="$WORLD_ROOT/$stamp-${{ github.run_id }}"
            mkdir -p "$save_dir"
            if [ -d "$GITHUB_WORKSPACE/server/world" ]; then
              cp -a "$GITHUB_WORKSPACE/server/world" "$save_dir/world"
            fi
            if [ -d "$GITHUB_WORKSPACE/server/plugins" ]; then
              cp -a "$GITHUB_WORKSPACE/server/plugins" "$save_dir/plugins"
            fi
            if [ -f "$GITHUB_WORKSPACE/server/server.properties" ]; then
              cp -a "$GITHUB_WORKSPACE/server/server.properties" "$save_dir/server.properties"
            fi
            if [ -d "$GITHUB_WORKSPACE/server/world" ]; then
              cp -a "$GITHUB_WORKSPACE/server/world" "$save_dir/world"
            fi
            if [ -f "$GITHUB_WORKSPACE/server/eula.txt" ]; then
              cp -a "$GITHUB_WORKSPACE/server/eula.txt" "$save_dir/eula.txt"
            fi
            cd "$GITHUB_WORKSPACE"
            git config user.name "Glide Server Bot"
            git config user.email "glide-server-bot@users.noreply.github.com"
            git add "Server/World/$stamp-${{ github.run_id }}"
            git commit -m "Save server world $stamp" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
            echo "GLIDE_WORLD_SAVED=$save_dir"
          }

          trigger_handoff() {
            export GH_TOKEN="${{ github.token }}"
            if [ "${{ inputs.server_slot }}" = "A" ]; then
              NEXT_SLOT="B"
            else
              NEXT_SLOT="A"
            fi

            gh workflow run server-session.yml \
              --ref "${GITHUB_REF_NAME}" \
              -f minecraft_version="${{ inputs.minecraft_version }}" \
              -f xmx_gb="${{ inputs.xmx_gb }}" \
              -f online_mode="${{ inputs.online_mode }}" \
              -f server_name="${{ inputs.server_name }}" \
              -f server_description="${{ inputs.server_description }}" \
              -f max_runtime_minutes="${{ inputs.max_runtime_minutes }}" \
              -f server_slot="$NEXT_SLOT"

            echo "GLIDE_NEXT_SLOT=$NEXT_SLOT"
            echo "GLIDE_HANDOFF_TRIGGERED=true"
          }

          mark_ready() {
            local slot="${{ inputs.server_slot }}"
            local marker="Server/Runtime/slot-${slot}-ready"
            mkdir -p "$(dirname "$marker")"
            printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$marker"
            git config user.name "Glide Server Bot"
            git config user.email "glide-server-bot@users.noreply.github.com"
            git add "$marker"
            git commit -m "Mark server slot $slot ready" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          }

          cleanup_playit() {
            docker rm -f glide-playit >/dev/null 2>&1 || true
          }

          trap 'cleanup_playit; if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; fi' EXIT

          if [ -z "${PLAYIT_SECRET:-}" ]; then
            echo "::error::PLAYIT_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/server"
          TOTAL_RUNTIME_SECONDS="$(( ${{ inputs.max_runtime_minutes }} * 60 ))"
          HANDOFF_LEAD_SECONDS=180
          if [ "$TOTAL_RUNTIME_SECONDS" -le "$HANDOFF_LEAD_SECONDS" ]; then
            HANDOFF_LEAD_SECONDS="$(( TOTAL_RUNTIME_SECONDS / 2 ))"
          fi
          HANDOFF_AFTER_SECONDS="$(( TOTAL_RUNTIME_SECONDS - HANDOFF_LEAD_SECONDS ))"
          echo "Server slot ${{ inputs.server_slot }} will hand off after $HANDOFF_AFTER_SECONDS seconds."

          docker rm -f glide-playit >/dev/null 2>&1 || true

          java -Xmx${{ inputs.xmx_gb }}G -Xms512M -jar server.jar nogui &
          SERVER_PID=$!

          echo "Waiting for Minecraft to listen on 127.0.0.1:25565..."
          for attempt in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/25565) >/dev/null 2>&1; then
              echo "Minecraft is listening on 127.0.0.1:25565."
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Minecraft exited before opening port 25565."
              wait "$SERVER_PID" 2>/dev/null || true
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Minecraft did not open port 25565 within 120 seconds."
              tail -n 100 "$GITHUB_WORKSPACE/server/logs/latest.log" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          docker pull ghcr.io/playit-cloud/playit-agent:latest
          docker run -d --name glide-playit --network host -e SECRET_KEY="$PLAYIT_SECRET" ghcr.io/playit-cloud/playit-agent:latest
          sleep 8

          echo "--- Playit agent status ---"
          docker ps --filter name=glide-playit --format 'status={{.Status}}'
          echo "--- Playit agent logs ---"
          docker logs --tail 100 glide-playit 2>&1 || true

          if ! docker ps --format '{{.Names}}' | grep -qx 'glide-playit'; then
            echo "::error::Playit Docker agent stopped immediately."
            exit 1
          fi

          echo "Minecraft server: 127.0.0.1:25565"
          echo "Playit agent is running for slot ${{ inputs.server_slot }}."
          mark_ready

          HANDOFF_START="$(date +%s)"
          while kill -0 "$SERVER_PID" 2>/dev/null; do
            ELAPSED="$(( $(date +%s) - HANDOFF_START ))"
            if [ "$ELAPSED" -ge "$HANDOFF_AFTER_SECONDS" ]; then
              echo "GLIDE_HANDOFF_SOON=true"
              echo "The server is preparing to swap. Progress may be lost from this point further."
              echo "Stopping the current Playit agent before handing the tunnel to the next runner."

              # Minecraft is stopped first so its normal shutdown flushes the world.
              cleanup_playit
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              SERVER_PID=""

              echo "Saving the clean world snapshot for the next server slot..."
              save_world

              trigger_handoff

              if [ "${{ inputs.server_slot }}" = "A" ]; then
                NEXT_SLOT="B"
              else
                NEXT_SLOT="A"
              fi

              NEXT_READY_MARKER="Server/Runtime/slot-$NEXT_SLOT-ready"
              echo "Waiting for slot $NEXT_SLOT to start its Minecraft server and connect its Playit agent..."

              elapsed=0
              while [ "$elapsed" -lt 180 ]; do
                git fetch origin "${GITHUB_REF_NAME}" --quiet
                if git show "origin/${GITHUB_REF_NAME}:$NEXT_READY_MARKER" >/dev/null 2>&1; then
                  echo "Slot $NEXT_SLOT is ready. The previous runner can exit."
                  exit 0
                fi
                sleep 3
                elapsed="$((elapsed + 3))"
              done

              echo "::error::Next server slot did not become ready within 180 seconds."
              exit 1
            fi
            sleep 5
          done

          wait "$SERVER_PID" 2>/dev/null || true
          exit 0
